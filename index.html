<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bank Application Filler</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f4f2; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6b66;
    --line: #dcdcd6; --accent: #c3002f; --field: #fafaf8;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #161615; --panel: #20201e; --ink: #ecece8; --muted: #a0a09a;
      --line: #3a3a36; --accent: #ff4d6a; --field: #2a2a27;
    }
  }
  :root[data-theme="dark"] {
    --bg: #161615; --panel: #20201e; --ink: #ecece8; --muted: #a0a09a;
    --line: #3a3a36; --accent: #ff4d6a; --field: #2a2a27;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

  header.bar { position: sticky; top: 0; z-index: 5; display: flex; gap: 8px; align-items: center;
    flex-wrap: wrap; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
  header.bar h1 { font-size: 16px; margin: 0 auto 0 0; }
  button { font: inherit; padding: 7px 14px; border-radius: 6px; border: 1px solid var(--line);
    background: var(--field); color: var(--ink); cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  label.toggle { display: flex; gap: 6px; align-items: center; color: var(--muted); }

  .wrap { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; padding: 16px; }
  @media (max-width: 900px) { .wrap { grid-template-columns: 1fr; } }

  form { display: flex; flex-direction: column; gap: 14px; }
  fieldset { margin: 0; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); padding: 12px 14px 14px; }
  legend { font-weight: 700; font-size: 12px; letter-spacing: .06em; text-transform: uppercase;
    color: var(--accent); padding: 0 6px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px 12px; }
  .grid .wide { grid-column: 1 / -1; }
  .fld { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .fld > span { font-size: 12px; color: var(--muted); }
  input, select { font: inherit; width: 100%; padding: 7px 9px; border: 1px solid var(--line);
    border-radius: 6px; background: var(--field); color: var(--ink); }
  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .radios { display: flex; gap: 12px; flex-wrap: wrap; padding-top: 4px; }
  .radios label { display: flex; gap: 4px; align-items: center; }
  .radios input { width: auto; }
  table.refs { width: 100%; border-collapse: collapse; }
  table.refs th { font-size: 12px; color: var(--muted); text-align: left; font-weight: 500; padding: 0 4px 4px; }
  table.refs td { padding: 3px 4px; }
  .hint { font-size: 12px; color: var(--muted); margin: 6px 0 0; }

  .pads { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
  .pad { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .pad > span { font-size: 12px; color: var(--muted); }
  .pad canvas { width: 100%; aspect-ratio: 10 / 3; background: #fff; border: 1px dashed var(--line);
    border-radius: 6px; touch-action: none; cursor: crosshair; }
  .pad .row { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--muted); }
  .pad button { padding: 3px 10px; font-size: 12px; }
  .sheet svg.brand { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .sheet .sig { position: absolute; object-fit: contain; object-position: center bottom; pointer-events: none; }

  .preview { position: sticky; top: 64px; align-self: start; }
  .preview .cap { font-size: 12px; color: var(--muted); margin-bottom: 6px; }

  /* The printable sheet: original form image with text laid over it */
  .sheet { position: relative; width: 100%; aspect-ratio: 1214 / 2000; container-type: inline-size;
    background: #fff; box-shadow: 0 2px 14px rgba(0,0,0,.18); overflow: hidden; }
  .sheet img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .sheet .f { position: absolute; transform: translateY(-50%); white-space: nowrap; overflow: hidden;
    color: #0b2a8a; font-family: Arial, Helvetica, sans-serif; font-size: 1.07cqw; line-height: 1.25; }
  .sheet.caps .f:not(.nocaps) { text-transform: uppercase; }
  .sheet .f.c { text-align: center; }
  .sheet .mark { position: absolute; transform: translate(-50%, -50%); width: 1.25cqw; height: 1.25cqw;
    border-radius: 50%; background: #0b2a8a; }

  @page { size: 8.5in 14in; margin: 0; }
  @media print {
    html, body { background: #fff !important; }
    header.bar, form, .preview .cap { display: none !important; }
    .wrap { display: block; padding: 0; }
    .preview { position: static; }
    .sheet { width: 8.5in; height: 14in; box-shadow: none; }
  }
</style>
</head>

  <h1>Bank Application</h1>
  <label class="toggle"><input type="checkbox" id="caps" checked> ALL CAPS</label>
  <button type="button" id="clear">Clear</button>
  <button type="button" id="print" class="primary">Print / Save PDF</button>
</header>

const el = (tag, attrs = {}, kids = []) => {
  const n = document.createElement(tag);
  for (const [a, v] of Object.entries(attrs)) a === 'text' ? n.textContent = v : n.setAttribute(a, v);
  kids.forEach(k => n.append(k));
  return n;
};

/* ---------- build the input form ---------- */
function input(f) {
  if (f.type === 'radio') {
    const box = el('div', { class: 'radios' });
    Object.keys(f.opts).forEach(o => {
      const r = el('input', { type: 'radio', name: f.k, value: o });
      if (data[f.k] === o) r.checked = true;
      box.append(el('label', {}, [r, o]));
    });
    return box;
  }
  if (f.opts) {
    const s = el('select', { name: f.k });
    f.opts.forEach(o => s.append(el('option', { value: o, text: o || '—' })));
    s.value = data[f.k] ?? '';
    return s;
  }
  const i = el('input', { name: f.k, type: f.type || 'text' });
  if (f.list) {
    const id = 'dl_' + f.k;
    i.setAttribute('list', id);
    form.append(el('datalist', { id }, f.list.map(v => el('option', { value: v }))));
  }
  if (f.k.includes('income') || ['price', 'dp'].includes(f.k)) i.setAttribute('inputmode', 'decimal');
  i.value = data[f.k] ?? (f.today ? new Date().toISOString().slice(0, 10) : (f.def || ''));
  return i;
}

SECTIONS.forEach(s => {
  const fs = el('fieldset', {}, [el('legend', { text: s.title })]);
  if (s.table) {
    const t = el('table', { class: 'refs' });
    t.append(el('tr', {}, s.cols.map(c => el('th', { text: c }))));
    for (let i = 0; i < s.fields.length; i += s.cols.length) {
      t.append(el('tr', {}, s.fields.slice(i, i + s.cols.length).map(f => el('td', {}, [input(f)]))));
    }
    fs.append(t);
  } else {
    const g = el('div', { class: 'grid' });
    s.fields.forEach(f => g.append(el('label', { class: 'fld' + (f.wide ? ' wide' : '') }, [el('span', { text: f.label }), input(f)])));
    fs.append(g);
  }
  if (s.note) fs.append(el('p', { class: 'hint', text: s.note }));
  form.append(fs);
});

/* ---------- overlay on the sheet ---------- */
const overlays = {};
function box(pos, cls = '') {
  const [x, y, w] = pos;
  const d = el('div', { class: 'f ' + cls });
  Object.assign(d.style, { left: pct(x, W), top: pct(y, H), width: pct(w, W) });
  sheet.append(d);
  return d;
}
ALL.forEach(f => {
  const cls = (f.c ? 'c ' : '') + (f.nocaps ? 'nocaps' : '');
  if (f.type === 'radio') {
    overlays[f.k] = Object.fromEntries(Object.entries(f.opts).map(([o, [x, y]]) => {
      const m = el('div', { class: 'mark' });
      Object.assign(m.style, { left: pct(x, W), top: pct(y, H), display: 'none' });
      sheet.append(m);
      return [o, m];
    }));
  } else if (f.bday) {
    overlays[f.k] = { mm: box(f.bday.mm, 'c'), dd: box(f.bday.dd, 'c'), yy: box(f.bday.yy, 'c') };
  } else {
    overlays[f.k] = box(f.pos, cls);
  }
});

function fit(d) {
  let size = 1.07;
  d.style.fontSize = size + 'cqw';
  while (d.scrollWidth > d.clientWidth + 1 && size > 0.6) {
    size -= 0.04;
    d.style.fontSize = size + 'cqw';
  }
}
const mdy = v => { const [y, m, d] = v.split('-'); return v ? `${m}/${d}/${y}` : ''; };
function ageFrom(v) {
  if (!v) return '';
  const b = new Date(v + 'T00:00'), n = new Date();
  let a = n.getFullYear() - b.getFullYear();
  if (n < new Date(n.getFullYear(), b.getMonth(), b.getDate())) a--;
  return a >= 0 && a < 130 ? String(a) : '';
}
const money = k => k.includes('income') || ['price', 'dp'].includes(k);
function fmtMoney(v) {
  const n = Number(String(v).replace(/[^\d.]/g, ''));
  if (!v || isNaN(n) || /[a-z]/i.test(v)) return v;
  return '₱ ' + n.toLocaleString('en-PH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function readForm() {
  const fd = new FormData(form);
  ALL.forEach(f => { data[f.k] = fd.get(f.k) ?? ''; });
}

function render() {
  ALL.forEach(f => {
    const o = overlays[f.k], v = data[f.k] || '';
    if (f.type === 'radio') {
      Object.entries(o).forEach(([opt, m]) => m.style.display = v === opt ? 'block' : 'none');
    } else if (f.bday) {
      const [y, m, d] = v ? v.split('-') : ['', '', ''];
      o.mm.textContent = m; o.dd.textContent = d; o.yy.textContent = y;
    } else {
      let t = v;
      if (f.type === 'date') t = mdy(v);
      if (money(f.k)) t = fmtMoney(v);
      if (!t && f.fallback) t = data[f.fallback] || '';
      o.textContent = t;
      fit(o);
    }
  });
}

svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
svg.innerHTML = `
  <g id="bTitle"><rect x="362" y="88" width="450" height="45" fill="#fff"/>
    <text x="586" y="125" text-anchor="middle" fill="#c3002f" font-size="43" font-weight="800"
      font-family="Montserrat, 'Helvetica Neue', Arial, sans-serif"></text></g>
  <rect x="345" y="155" width="478" height="18" fill="#fff"/>`;
sheet.append(svg);

function fitText(t, max) {
  t.removeAttribute('textLength'); t.removeAttribute('lengthAdjust');
  if (t.getComputedTextLength() > max) { t.setAttribute('textLength', max); t.setAttribute('lengthAdjust', 'spacingAndGlyphs'); }
}
function renderBranch() {
  const name = branch.name;
  bSel.value = name;
  // Carmona: leave the scanned title untouched. The address line is always blanked out.
  const g1 = svg.getElementById('bTitle');
  g1.style.display = name === 'Carmona' ? 'none' : '';
  const t1 = g1.querySelector('text');
  t1.textContent = ('Nissan ' + name).toUpperCase();
  fitText(t1, 560);
}
function saveBranch() { try { localStorage.setItem(BSTORE, JSON.stringify(branch)); } catch (e) {} }
bSel.addEventListener('change', () => { branch.name = bSel.value; saveBranch(); renderBranch(); });
renderBranch();
document.fonts && document.fonts.ready.then(renderBranch);

/* ---------- e-signatures ---------- */
const SIGS = [
  { k: 'sigimg_mp', label: 'Nissan marketing professional', x: 68, w: 297 },
  { k: 'sigimg_grm', label: 'Group retail manager', x: 395, w: 332 },
  { k: 'sigimg_client', label: "Client's signature", x: 773, w: 363 },
];
const SIG_TOP = 1746, SIG_BOTTOM = 1800, INK = '#0b2a8a';
const pads = [];
const sigSet = el('fieldset', {}, [el('legend', { text: 'E-signatures' })]);
const sigGrid = el('div', { class: 'pads' });
sigSet.append(sigGrid, el('p', { class: 'hint', text: 'Sign with a mouse, trackpad, or finger. Each signature is placed above its line on the form.' }));
form.append(sigSet);

function trim(c) {
  const ctx = c.getContext('2d'), { width, height } = c;
  const px = ctx.getImageData(0, 0, width, height).data;
  let x0 = width, y0 = height, x1 = -1, y1 = -1;
  for (let y = 0; y < height; y++) for (let x = 0; x < width; x++) {
    if (px[(y * width + x) * 4 + 3] > 10) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  }
  if (x1 < 0) return '';
  const pad = 6, out = document.createElement('canvas');
  out.width = x1 - x0 + 1 + pad * 2; out.height = y1 - y0 + 1 + pad * 2;
  out.getContext('2d').drawImage(c, x0, y0, x1 - x0 + 1, y1 - y0 + 1, pad, pad, x1 - x0 + 1, y1 - y0 + 1);
  return out.toDataURL('image/png');
}

SIGS.forEach(s => {
  const c = el('canvas', { width: 900, height: 270, 'aria-label': s.label + ' signature pad' });
  const clr = el('button', { type: 'button', text: 'Clear' });
  sigGrid.append(el('div', { class: 'pad' }, [el('span', { text: s.label }), c, el('div', { class: 'row' }, ['Sign above', clr])]));

  const img = el('img', { class: 'sig', alt: '' });
  Object.assign(img.style, { left: pct(s.x, W), width: pct(s.w, W), top: pct(SIG_TOP, H), height: pct(SIG_BOTTOM - SIG_TOP, H) });
  sheet.append(img);

  const ctx = c.getContext('2d');
  ctx.lineWidth = 5; ctx.lineCap = ctx.lineJoin = 'round'; ctx.strokeStyle = INK;
  const pt = e => { const r = c.getBoundingClientRect(); return [(e.clientX - r.left) * c.width / r.width, (e.clientY - r.top) * c.height / r.height]; };
  let last = null;
  c.addEventListener('pointerdown', e => { try { c.setPointerCapture(e.pointerId); } catch (err) {} last = pt(e); ctx.beginPath(); ctx.arc(...last, 2.5, 0, 7); ctx.fillStyle = INK; ctx.fill(); });
  c.addEventListener('pointermove', e => {
    if (!last) return;
    const p = pt(e), mid = [(last[0] + p[0]) / 2, (last[1] + p[1]) / 2];
    ctx.beginPath(); ctx.moveTo(...last); ctx.quadraticCurveTo(last[0], last[1], ...mid); ctx.lineTo(...p); ctx.stroke();
    last = p;
  });
  const end = () => { if (!last) return; last = null; save(trim(c)); };
  c.addEventListener('pointerup', end);
  c.addEventListener('pointercancel', end);

  function save(url) {
    if (url) data[s.k] = url; else delete data[s.k];
    try { localStorage.setItem(STORE, JSON.stringify(data)); } catch (err) {}
    show();
  }
  function show() {
    if (data[s.k]) { img.src = data[s.k]; img.style.display = 'block'; } else { img.removeAttribute('src'); img.style.display = 'none'; }
  }
  function wipe() { ctx.clearRect(0, 0, c.width, c.height); }
  clr.addEventListener('click', () => { wipe(); save(''); });

  // restore a saved signature onto the pad
  if (data[s.k]) {
    const im = new Image();
    im.onload = () => {
      const k = Math.min(c.width / im.width, c.height / im.height, 1);
      ctx.drawImage(im, (c.width - im.width * k) / 2, (c.height - im.height * k) / 2, im.width * k, im.height * k);
    };
    im.src = data[s.k];
  }
  show();
  pads.push({ wipe, show });
});

form.addEventListener('input', e => {
  readForm();
  // auto-fill age from birthday
  const f = ALL.find(x => x.k === e.target.name);
  if (f && f.age) {
    data[f.age] = ageFrom(data[f.k]);
    form.elements[f.age].value = data[f.age];
  }
  try { localStorage.setItem(STORE, JSON.stringify(data)); } catch (err) {}
  render();
});

document.getElementById('caps').addEventListener('change', e => { sheet.classList.toggle('caps', e.target.checked); render(); });
document.getElementById('clear').addEventListener('click', () => {
  if (!confirm('Clear every field?')) return;
  data = {};
  try { localStorage.removeItem(STORE); } catch (err) {}
  form.reset();
  pads.forEach(p => { p.wipe(); p.show(); });
  renderBranch();
  ALL.filter(f => f.today).forEach(f => form.elements[f.k].value = new Date().toISOString().slice(0, 10));
  ALL.filter(f => f.def).forEach(f => form.elements[f.k].value = f.def);
  readForm(); render();
});
document.getElementById('print').addEventListener('click', () => {
  const n = (data.a_name || '').trim();
  const old = document.title;
  if (n) document.title = 'Bank Application - ' + n;   // becomes the default PDF filename
  window.print();
  document.title = old;
});

readForm();
document.getElementById('bg').complete ? render() : document.getElementById('bg').addEventListener('load', render);
</script>
